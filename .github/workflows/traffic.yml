name: NOC traffic stats

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/gc_stats.py", ".github/workflows/traffic.yml"]

permissions:
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pull stats from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -f tools/gc_probe.py ]; then python3 tools/gc_probe.py; exit 0; fi
          python3 tools/gc_stats.py
      - name: Commit
        run: |
          set +e
          git add noc/traffic.json 2>/dev/null
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name="Web desk" -c user.email="webdesk@attelkom.net" commit -qm "NOC traffic stats"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          echo "::error::push failed"; exit 1
