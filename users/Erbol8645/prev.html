<!DOCTYPE html>
<html>
<head>
    <title>Webring - Previous</title>
</head>
<body>
    <script>
        function activate() {
            if (typeof urls === "undefined" || typeof id === "undefined") {
                console.error("URLs or ID not initialized.");
                return;
            }

            var targetURL = "";
            var targetid = id;

            // Find the previous valid URL in the list
            while (targetURL === "") {
                targetid--;
                if (targetid < 0) targetid = urls.length - 1; // Loop back to the end if at the start
                targetURL = urls[targetid].trim(); // Trim whitespace from URLs
            }

            // Redirect to the target URL
            location.href = targetURL;
        }
    </script>
    <script src="getid.js"></script>
</body>
</html>
